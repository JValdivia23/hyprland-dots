            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = spk_dsp
                        label = param_eq
                        config = {
                            filters = [
                                # Preamp attenuation (-6.0 dB) to prevent digital clipping from +11 dB peak boosts
                                { type = bq_highshelf freq = 0 gain = -6.0 },
                                # Sub-bass protection high-pass filter (85 Hz, 12 dB/oct) to prevent transducer flapping
                                { type = bq_highpass freq = 85.0 q = 0.707 },
                                # 20-Band Factory Acoustic Optimizer Curve (ViaolaE / ALC274 subsys 0x10ec11f0)
                                { type = bq_peaking freq = 47.0 q = 0.94 gain = 5.00 },
                                { type = bq_peaking freq = 141.0 q = 1.41 gain = 10.50 },
                                { type = bq_peaking freq = 234.0 q = 2.45 gain = 11.00 },
                                { type = bq_peaking freq = 328.0 q = 2.85 gain = 5.69 },
                                { type = bq_peaking freq = 469.0 q = 2.89 gain = 1.00 },
                                { type = bq_peaking freq = 656.0 q = 3.46 gain = -4.12 },
                                { type = bq_peaking freq = 844.0 q = 4.47 gain = -8.69 },
                                { type = bq_peaking freq = 1031.0 q = 4.47 gain = -1.19 },
                                { type = bq_peaking freq = 1313.0 q = 4.04 gain = 3.69 },
                                { type = bq_peaking freq = 1688.0 q = 3.67 gain = -0.12 },
                                { type = bq_peaking freq = 2250.0 q = 3.47 gain = 3.62 },
                                { type = bq_peaking freq = 3000.0 q = 3.97 gain = 2.44 },
                                { type = bq_peaking freq = 3750.0 q = 4.47 gain = 5.12 },
                                { type = bq_peaking freq = 4688.0 q = 4.56 gain = 4.81 },
                                { type = bq_peaking freq = 5813.0 q = 4.78 gain = 0.31 },
                                { type = bq_peaking freq = 7125.0 q = 4.53 gain = 3.38 },
                                { type = bq_peaking freq = 9000.0 q = 4.38 gain = 1.94 },
                                { type = bq_peaking freq = 11250.0 q = 4.63 gain = 8.50 },
                                { type = bq_peaking freq = 13875.0 q = 3.44 gain = 11.31 },
                                { type = bq_peaking freq = 19688.0 q = 2.77 gain = -6.69 }
                            ]
                        }
                    }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "surface_speaker_dsp"
                node.description = "Surface Book 3 Speakers (Calibrated)"
                media.class      = "Audio/Sink"
                priority.driver  = 1015
                priority.session = 1015
            }
            playback.props = {
                node.name     = "playback.surface_speaker_dsp"
                node.passive  = true
                target.object = "alsa_output.pci-0000_00_1f.3.analog-stereo"
            }
        }
    }

    # 2. Surface Book 3 Factory Calibrated Dual Microphone Array Source
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Surface Book 3 Dual Mic Array (Calibrated)"
            media.name       = "Surface Book 3 Dual Mic Array (Calibrated)"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = mic_dsp
                        label = param_eq
                        config = {
                            filters = [
