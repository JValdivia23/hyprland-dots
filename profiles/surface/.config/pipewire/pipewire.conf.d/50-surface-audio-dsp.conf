# - Layer 1: Dolby Atmos / VLLDP 20-band hardware speaker optimizer curve
#   (dax3extdolbyatmos_13/DEV_0274_SUBSYS_10EC11F0_PCI_SUBSYS_72708086.xml)
# - Layer 2: Realtek dual-microphone array parametric calibration EQ
#   (hdxsstmd3a/RTAIODAT.DAT: RTMICAR + RTMICEQ0)

context.modules = [
    # 1. Surface Book 3 Factory Calibrated Speaker Sink
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Surface Book 3 Speakers (Calibrated)"
