# DKMS config for Intel IPU4P (Ice Lake 8086:8a19) + Surface Book 3 / Pro 7 sensors
# Based on ruslanbay/ipu4-drivers RFC v2 + Surface Book 3 D-PHY & INT3472 fixes.
PACKAGE_NAME="surface-ipu4p"
PACKAGE_VERSION="0.2.0"
MAKE[0]="make KVERSION=$kernelver KDIR=$kernel_source_dir"

BUILT_MODULE_NAME[0]="intel-ipu6"
BUILT_MODULE_LOCATION[0]="src/ipu6"
DEST_MODULE_LOCATION[0]="/updates/dkms"

BUILT_MODULE_NAME[1]="intel-ipu6-isys"
BUILT_MODULE_LOCATION[1]="src/ipu6"
DEST_MODULE_LOCATION[1]="/updates/dkms"

BUILT_MODULE_NAME[2]="ov7251"
BUILT_MODULE_LOCATION[2]="src/i2c"
DEST_MODULE_LOCATION[2]="/updates/dkms"

BUILT_MODULE_NAME[3]="ov5693"
BUILT_MODULE_LOCATION[3]="src/i2c"
DEST_MODULE_LOCATION[3]="/updates/dkms"

BUILT_MODULE_NAME[4]="dw9719"
BUILT_MODULE_LOCATION[4]="src/i2c"
DEST_MODULE_LOCATION[4]="/updates/dkms"

AUTOINSTALL="yes"
BUILD_EXCLUSIVE_KERNEL="-cachyos"
