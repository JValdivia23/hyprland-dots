# DKMS config for Microsoft Surface UCSI-over-HID (ucsi_surface_hid) and
# patched SSAM charger Artg power limit (surface_charger) drivers.
# Upstream PRs:
#   - https://github.com/linux-surface/kernel/pull/184
#   - https://github.com/linux-surface/linux-surface/pull/2354
PACKAGE_NAME="surface-usbc"
PACKAGE_VERSION="0.2.0"
MAKE[0]="make KVERSION=$kernelver KDIR=$kernel_source_dir"

BUILT_MODULE_NAME[0]="ucsi_surface_hid"
BUILT_MODULE_LOCATION[0]="src"
DEST_MODULE_LOCATION[0]="/updates/dkms"

BUILT_MODULE_NAME[1]="surface_charger"
BUILT_MODULE_LOCATION[1]="src"
DEST_MODULE_LOCATION[1]="/updates/dkms"

AUTOINSTALL="yes"
BUILD_EXCLUSIVE_KERNEL="^(7\.[1-9]|[89]\.).*-cachyos"
