# DKMS config for the out-of-tree Intel Precise Touch & Stylus (IPTS) driver.
# Source: https://github.com/linux-surface/intel-precise-touch @ 3b88a45 (2024-04-16)
# Only built for CachyOS kernels; linux-surface already ships ipts in-tree.
PACKAGE_NAME="ipts"
PACKAGE_VERSION="2024.04.16"
MAKE[0]="make KVERSION=$kernelver KDIR=$kernel_source_dir"
BUILT_MODULE_NAME[0]="ipts"
BUILT_MODULE_LOCATION[0]="src"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
BUILD_EXCLUSIVE_KERNEL="-cachyos"
