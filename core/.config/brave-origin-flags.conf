# Global flags for brave-origin
# Use basic password store to avoid GNOME Keyring / gcr-prompter prompts on desktop/webapps
--password-store=basic
--ozone-platform-hint=auto
--enable-features=VaapiVideoDecodeLinuxGL,VaapiVideoEncoder,VaapiIgnoreDriverChecks,CanvasOopRasterization,UseMultiPlaneFormatForHardwareVideo
--enable-gpu-rasterization
--enable-zero-copy
--ignore-gpu-blocklist
--enable-wayland-ime
